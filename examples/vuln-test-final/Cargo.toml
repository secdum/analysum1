[package]
name = "vuln-test"
version = "0.1.0"
edition = "2021"

[dependencies]
# RUSTSEC-2021-0145 - atty: potential unaligned read (unmaintained)
atty = "0.2.14"

# RUSTSEC-2022-0006 - thread_local: ReentrantMutex unsound
thread_local = "1.0.1"

# RUSTSEC-2021-0127 - yaml-rust: unmaintained
yaml-rust = "0.4.4"

# cargo-geiger will flag this: contains unsafe code
libc = "0.2.0"
