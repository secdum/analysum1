name: Upload Evidence to Release

on:
  push:
    tags:
      - 'v*' # The Action only triggers when a tag is pushed (e.g., v1.0.0, v1.1, etc.)

jobs:
  release-evidence:
    name: Generate and Upload Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for the Action to create the Release and attach files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      # Ensures the target outputs directory exists before running the orchestration script
      - name: Create Outputs Directory
        run: mkdir -p research/Rust/initial-tests/outputs

      # Runs your master Python script non-interactively to trigger both Rust and C analysis
      - name: Run SecDojo Scanners
        run: |
          echo "Executing unified security scans..."
          python secdojo_scan.py --lang all --path .

      # Collects the generated SARIF report and moves it into your designated outputs folder
      - name: Organize Report Artifacts
        run: |
          if [ -f "secdojo_report.sarif" ]; then
            mv secdojo_report.sarif research/Rust/initial-tests/outputs/
          fi

      # Compresses the target directory into a single archive for the Release attachment
      - name: Zip the outputs
        run: |
          zip -r evidence.zip research/Rust/initial-tests/outputs/ || true

      # Creates the GitHub Release matching your tag version and uploads the evidence archive
      - name: Create Release and Attach Asset
        uses: softprops/action-gh-release@v2
        with:
          files: evidence.zip
          generate_release_notes: true