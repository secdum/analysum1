name: Upload Evidence to Release

on:
  push:
    tags:
      - 'v*' # Runs only when a tag is pushed (e.g. v1.0.0, v1.1)

jobs:
  release-evidence:
    name: Generate and Upload Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the Release and attach files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create evidence directory
        # Local folder mounted into the container via volume (-v)
        # Anything the scanner writes to /workspace lands here on the host
        run: mkdir -p ${{ github.workspace }}/evidence

      - name: Build scanner image
        # Builds the image with all required tools (cargo-audit, geiger, cppcheck...)
        run: docker build -f Dockerfile.unified -t secdojo-scanner:release .

      - name: Detect scan targets
        id: detect
        run: |
          has_c=false
          has_rust=false
          # Check for C/H files anywhere in the repo
          if find . -name "*.c" -o -name "*.h" | grep -q .; then
            has_c=true
          fi
          # Check for Cargo.toml anywhere in the repo
          if find . -name "Cargo.toml" | grep -q .; then
            has_rust=true
          fi
          echo "has_c=$has_c" >> "$GITHUB_OUTPUT"
          echo "has_rust=$has_rust" >> "$GITHUB_OUTPUT"
          echo "Detected: C=$has_c, Rust=$has_rust"

      - name: Run C Scan
        if: steps.detect.outputs.has_c == 'true'
        run: |
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            secdojo-scanner:release \
            python3 secdojo/secdojo_scan.py --lang c --path /workspace
          echo "C scan exit code: $?"
          set -e
        continue-on-error: true

      - name: Run Rust Scan
        if: steps.detect.outputs.has_rust == 'true'
        run: |
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            secdojo-scanner:release \
            python3 secdojo/secdojo_scan.py --lang rust --path /workspace
          echo "Rust scan exit code: $?"
          set -e
        continue-on-error: true

      - name: Collect all outputs into evidence/
        # Finds all .sarif and .json files produced by the scanner anywhere
        # in the workspace and copies them into evidence/ for archiving
        run: |
          find ${{ github.workspace }} \
            -maxdepth 4 \
            \( -name "*.sarif" -o -name "*.json" \) \
            ! -path "*/evidence/*" \
            ! -path "*/.git/*" \
            ! -path "*/node_modules/*" \
            -exec cp {} ${{ github.workspace }}/evidence/ \;
          echo "=== Collected files ==="
          ls -lh ${{ github.workspace }}/evidence/

      - name: Zip evidence
        # Compresses all collected outputs into a single archive for the Release
        run: |
          if [ "$(ls -A evidence/)" ]; then
            zip -r evidence.zip evidence/
          else
            echo "No evidence files produced" > evidence/scan_summary.txt
            zip -r evidence.zip evidence/
          fi

      - name: Create Release and attach evidence
        # Creates the GitHub Release named after the tag and attaches evidence.zip
        uses: softprops/action-gh-release@v2
        with:
          files: evidence.zip
          generate_release_notes: true