name: Upload Evidence to Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-evidence:
    name: Generate and Upload Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the Release and attach files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Unified Docker Image
        run: |
          docker build -f Dockerfile.unified -t secdojo-scanner:release .

      - name: Create output directory
        run: mkdir -p evidence

      # Run C scan inside the Docker container (where tools are installed)
      - name: Run C Scan
        run: |
          set +e
          docker run --rm \
            -v ${{ github.workspace }}/evidence:/output \
            secdojo-scanner:release \
            bash -c 'python3 scanners/C/c_scan.py examples/c_vun_codes > /output/c_scan_results.sarif.json 2>/dev/null'
          echo "C scan finished with exit code $?"
          set -e
        continue-on-error: true

      # Run Rust scan inside the Docker container
      - name: Run Rust Scan
        run: |
          set +e
          docker run --rm \
            -v ${{ github.workspace }}/evidence:/output \
            secdojo-scanner:release \
            bash -c 'cd examples/rust_insecure && cargo generate-lockfile 2>/dev/null; cd /app && python3 secdojo/secdojo_scan.py --lang rust --path examples/rust_insecure > /output/rust_scan_output.txt 2>&1'
          echo "Rust scan finished with exit code $?"
          set -e
        continue-on-error: true

      # Run the unified CLI scan
      - name: Run Unified Scan
        run: |
          set +e
          docker run --rm \
            -v ${{ github.workspace }}/evidence:/output \
            secdojo-scanner:release \
            bash -c 'python3 secdojo/secdojo_scan.py --lang all --path examples/ > /output/unified_scan_output.txt 2>&1'
          echo "Unified scan finished with exit code $?"
          set -e
        continue-on-error: true

      - name: List generated evidence
        run: |
          echo "=== Evidence files ==="
          ls -la evidence/
          echo ""
          for f in evidence/*; do
            echo "--- $f (first 20 lines) ---"
            head -20 "$f" 2>/dev/null || true
          done

      - name: Zip evidence
        run: |
          cd evidence
          zip -r ../evidence.zip . || true

      - name: Create Release and Attach Evidence
        uses: softprops/action-gh-release@v2
        with:
          files: evidence.zip
          generate_release_notes: true