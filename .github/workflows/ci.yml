name: SecDojo-Scan CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:

  security-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: SAST Scanning (Bandit)
        run: |
          bandit -r . -ll
        continue-on-error: true

      - name: Build Unified Docker Image
        run: |
          docker build -f Dockerfile.unified -t secdojo-scanner:test .

      - name: Container Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'secdojo-scanner:test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Tool Against C Test Files
        run: |
          docker run --rm secdojo-scanner:test python3 secdojo/secdojo_scan.py --lang c --path C/vun-codes
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ] || [ $EXIT_CODE -eq 1 ]; then
            echo "C Scan passed successfully or found expected vulnerabilities (exit code $EXIT_CODE)."
            exit 0
          else
            echo "C Scan failed with runtime error (exit code $EXIT_CODE)."
            exit $EXIT_CODE
          fi

      - name: Run Tool Against Rust Test Repository
        run: |
          docker run --rm secdojo-scanner:test python3 secdojo/secdojo_scan.py --lang rust --path tests/fixtures/rust_insecure
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ] || [ $EXIT_CODE -eq 1 ]; then
            echo "Rust Scan passed successfully or found expected vulnerabilities (exit code $EXIT_CODE)."
            exit 0
          else
            echo "Rust Scan failed with runtime error (exit code $EXIT_CODE)."
            exit $EXIT_CODE
          fi
